[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hackjunction-company"
version = "0.1.0"
description = "AI ecommerce company with a durable simulated listing workflow"
requires-python = ">=3.11,<3.13"
dependencies = [
  "certifi>=2024.8.30",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "openai>=1.60,<3",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
company-api = "company.cli.serve:main"
company-db-init = "company.cli.init_db:main"
company-init-admin = "company.cli.init_admin:main"
company-export-openapi = "company.cli.export_openapi:main"
company-seed-demo = "company.cli.seed_demo:main"
company-smoke-mimo = "company.cli.smoke_mimo:main"
company-worker = "company.worker:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/company"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires an explicitly configured independent PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

